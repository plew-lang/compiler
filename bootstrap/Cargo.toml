[package]
name = "plewc"
version = "0.1.0"
edition = "2024"

# stage0 bootstrap compiler for Plew (throwaway; replaced by self-hosting).
# lib + bin layout so the compiler internals are testable from tests/.

[lib]
name = "plewc"
path = "src/lib.rs"

[[bin]]
name = "plewc"
path = "src/main.rs"

